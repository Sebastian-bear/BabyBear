<header class="babybear-header">
  <div class="babybear-header-content">
    <a routerLink="/" class="left-section">
      <img src="assets/logo.svg" alt="BabyBear Logo" class="logo" />
      <div class="brand">
        <h1>Orsetto</h1>
        <p class="slogan">Tecnología que no hiberna</p>
      </div>
    </a>

    <button class="hamburger" aria-label="Menú" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav-links" [class.open]="menuAbierto">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="cerrarMenu()">Inicio</a>
      <a routerLink="/contacto" routerLinkActive="active" (click)="cerrarMenu()">Contacto</a>
      <div class="dropdown nav-dropdown">
        <button type="button" class="dropdown-toggle" (click)="toggleDropdown()" [attr.aria-expanded]="dropdownAbierto" aria-haspopup="menu">
          Servicios
        </button>
        <div class="dropdown-menu" [class.open]="dropdownAbierto" role="menu">
          <a routerLink="/transformacion" routerLinkActive="active" (click)="cerrarMenu()" role="menuitem">Evolución digital estratégica</a>
          <a routerLink="/web" routerLinkActive="active" (click)="cerrarMenu()" role="menuitem">Web</a>
          <a routerLink="/movil" routerLinkActive="active" (click)="cerrarMenu()" role="menuitem">Móvil</a>
        </div>
      </div>
      <a routerLink="/nosotros" routerLinkActive="active" (click)="cerrarMenu()">Nosotros</a>
    </nav>
  </div>
</header>
